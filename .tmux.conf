# =============================================================================
# CORE SETTINGS
# =============================================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# portable login shell: honour $SHELL when set, else fall back to sh
set -g default-shell /bin/sh
if-shell '[ -n "$SHELL" ]' 'set-option -g default-shell "$SHELL"'

# Nuke tmux mouse control - let the terminal handle copy/paste natively
set -g mouse off

# Server options (use -s per tmux 3.5+ docs; -g works but -s is correct scope)
set -s default-terminal "tmux-256color"
# terminal-features is an array: -a appends, so this grew on every reload; 0-2 are
# tmux's built-ins, so assign by index to stay idempotent.
set -s terminal-features[3] "xterm*:RGB"
set -s terminal-features[4] "alacritty:RGB"
set -s terminal-features[5] "*256col*:RGB"
set -s extended-keys on
set -s escape-time 10
set -s focus-events on

setw -g aggressive-resize on
set -g history-limit 100000

setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

set -g renumber-windows on
set -g repeat-time 1000

setw -g automatic-rename on
setw -g allow-rename off
set -g set-titles on
set -g set-titles-string "#S / #W"

set -g status-keys vi
setw -g mode-keys vi

set -s set-clipboard on

# =============================================================================
# WINDOW & PANE MANAGEMENT
# =============================================================================

set -g base-index 1
setw -g pane-base-index 1

bind c new-window -c "#{pane_current_path}"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind z resize-pane -Z

bind > swap-pane -D
bind < swap-pane -U

bind b break-pane -d
# double quotes, not single: tmux's tokenizer concatenates quoted and unquoted
# runs, so a ' would close the quote early and lose characters
bind j command-prompt -p "join pane from window: " 'join-pane -h -s "%%"'

bind x kill-pane
bind X kill-window

bind S setw synchronize-panes\; display-message "Synchronize panes: #{?pane_synchronized,ON,OFF}"

bind = select-layout even-horizontal
bind + select-layout even-vertical
bind M-- select-layout main-vertical
bind M-| select-layout main-horizontal

# =============================================================================
# WINDOW NAVIGATION
# =============================================================================

bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

bind -n C-S-Left swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

bind a last-window
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

bind w choose-tree -Z -w

# =============================================================================
# COPY MODE
# =============================================================================

bind [ copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

bind -T copy-mode-vi y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf 2>/dev/null || clip.exe 2>/dev/null || pbcopy 2>/dev/null || xclip -selection clipboard 2>/dev/null || xsel -b 2>/dev/null || cat"

bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "win32yank.exe -i --crlf 2>/dev/null || clip.exe 2>/dev/null || pbcopy 2>/dev/null || xclip -selection clipboard 2>/dev/null || xsel -b 2>/dev/null || cat"

# =============================================================================
# SESSION MANAGEMENT
# =============================================================================

bind s choose-tree -Zs -O name

bind N command-prompt -p "New session name: " 'new-session -s "%%"'
bind R command-prompt -p "Rename session: " 'rename-session "%%"'

bind d detach

# =============================================================================
# STATUS BAR
# =============================================================================

set -g status-interval 5
set -g status-justify left
set -g status-position bottom
set -g status-style bg=colour234,fg=colour250

set -g status-left-length 40
set -g status-left "#[bg=colour27,fg=colour255,bold] #S #[bg=colour234,fg=colour27]#[default]"

set -g status-right-length 100
set -g status-right "#[fg=colour237]#[bg=colour237,fg=colour248] %H:%M #[fg=colour241]#[fg=colour250] %d-%b-%Y #[bg=colour237,fg=colour27]#[bg=colour27,fg=colour255] #h "

setw -g window-status-format "#[fg=colour250] #I:#W "
setw -g window-status-current-format "#[bg=colour237,fg=colour234]#[bg=colour237,fg=colour255,bold] #I:#W #[bg=colour234,fg=colour237]"

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour27

# =============================================================================
# TPM PLUGINS
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
